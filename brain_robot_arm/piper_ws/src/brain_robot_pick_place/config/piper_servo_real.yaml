# MoveIt Servo input side for protected real-arm visual alignment.
# Its trajectory output is intentionally not connected to the PiPER driver;
# piper_jog_adapter performs the explicit, clamped conversion instead.
use_gazebo: false
command_in_type: speed_units
scale:
  linear: 0.02
  rotational: 0.05
  joint: 0.05
publish_period: 0.05
low_latency_mode: false
command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false
smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin
is_primary_planning_scene_monitor: false
# The physical PiPER visual controller commands only the six-axis arm group.
move_group_name: arm
planning_frame: base_link
ee_frame_name: gripper_base
robot_link_command_frame: gripper_base
incoming_command_timeout: 0.20
num_outgoing_halt_msgs_to_publish: 4
lower_singularity_threshold: 17.0
hard_stop_singularity_threshold: 30.0
joint_limit_margin: 0.10
leaving_singularity_threshold_multiplier: 2.0
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
# The vendor driver appends a non-URDF "gripper" feedback field.  Servo must
# consume the adapter's six-axis filtered copy rather than the raw topic.
joint_topic: /piper_moveit_joint_states
status_topic: ~/status
command_out_topic: /piper_servo/unused_joint_trajectory
# B3: Servo must query MoveIt's planning scene. The scene's depth point cloud
# is configured by brain_robot_ball_pick/config/sensors_3d_real.yaml.
check_collisions: true
